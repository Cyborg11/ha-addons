<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#edf3f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1719" media="(prefers-color-scheme: dark)">
<title>Anmelden – Trinkprotokoll</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap narrow">
  <p class="eyebrow">Trinkprotokoll</p>
  <h1>Anmelden</h1>
  <form class="card form" id="f" novalidate>
    <div class="field">
      <label for="u">Name</label>
      <input id="u" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="p">Passwort</label>
      <input id="p" type="password" autocomplete="current-password">
    </div>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="primary" id="go" type="submit">Anmelden</button>
  </form>
</div>
<script src="login.js"></script>
</body>
</html>
