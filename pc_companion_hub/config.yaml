name: "PC-Companion Hub"
version: "0.20.1"
slug: pc_companion_hub
description: "Dashboard und Wake-on-LAN für den PC-Companion-Agenten (Gaming-PC)"
url: "https://github.com/Cyborg11/PCCompanion"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
host_network: true
webui: "http://[HOST]:[PORT:8099]"
ingress: true
homeassistant_api: true
ingress_port: 8099
panel_icon: mdi:monitor-dashboard
panel_title: PC-Companion
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Weboberfläche (PWA)"
options:
  agent_host: ""
  agent_port: 8765
  agent_token: ""
  pc_mac: ""
  broadcast_ip: "255.255.255.255"
  ui_token: ""
  pin: ""
  pcs: []
  wake_mode: "standby"
  notify_service: ""
  notify_jobs: true
  notify_pc_state: true
  notify_temp_c: 85
  public_url: ""
  tools: []
schema:
  agent_host: str?
  agent_port: port?
  agent_token: password?
  pc_mac: str?
  broadcast_ip: str?
  wake_mode: list(standby|cold)?
  wake_timeout_s: int(30,900)?
  launch_delay_s: int(0,180)?
  pcs:
    - name: str
      host: str
      port: port?
      token: password
      mac: str?
      broadcast_ip: str?
      wake_mode: list(standby|cold)?
      wake_timeout_s: int(30,900)?
      launch_delay_s: int(0,180)?
  ui_token: password?
  pin: password?
  notify_service: str?
  notify_jobs: bool?
  notify_pc_state: bool?
  notify_temp_c: int(0,120)?
  public_url: str?
  tools:
    - name: str
      url: str
