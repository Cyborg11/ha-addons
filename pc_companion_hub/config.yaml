name: "PC-Companion Hub"
version: "0.8.0"
slug: pc_companion_hub
description: "Dashboard und Wake-on-LAN für den PC-Companion-Agenten (Gaming-PC)"
url: "https://github.com/Cyborg11/PCCompanion"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
host_network: true
webui: "http://[HOST]:[PORT:8099]"
ingress: true
ingress_port: 8099
panel_icon: mdi:monitor-dashboard
panel_title: PC-Companion
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Weboberfläche (PWA)"
options:
  agent_host: ""
  agent_port: 8765
  agent_token: ""
  pc_mac: ""
  broadcast_ip: "255.255.255.255"
  ui_token: ""
  pin: ""
  pcs: []
  public_url: ""
  tools: []
schema:
  agent_host: str?
  agent_port: port?
  agent_token: password?
  pc_mac: str?
  broadcast_ip: str?
  pcs:
    - name: str
      host: str
      port: port?
      token: password
      mac: str?
      broadcast_ip: str?
  ui_token: password?
  pin: password?
  public_url: str?
  tools:
    - name: str
      url: str
